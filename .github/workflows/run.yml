name: Run Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: telegram-bot-instance
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Libraries & Playwright
        run: |
          pip install playwright python-telegram-bot requests curl_cffi httpx
          playwright install chromium
          playwright install-deps

      - name: Pull Code & Data from Private Repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/soosle2167-byte/bot-data.git temp_data
          cp -rf temp_data/* .

      - name: Run Bot Silently & Auto-Sync
        run: |
          (
            while true; do
              sleep 300
              rm -f temp_data/*.json temp_data/.git/index.lock
              cp -f *.json temp_data/ 2>/dev/null || true
              (
                cd temp_data
                git config user.name "Bot Sync"
                git config user.email "bot@noreply.github.com"
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "Auto-sync bot data"
                  git push || true
                fi
              )
            done
          ) &
          SYNC_PID=$!
          set +e
          timeout 340m python bot.py
          echo $? > bot_exit_code.txt
          kill $SYNC_PID 2>/dev/null || true

      - name: Save Data & Trigger Next Session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          rm -f temp_data/*.json temp_data/.git/index.lock
          cp -f *.json temp_data/ 2>/dev/null || true
          cd temp_data
          git config user.name "Bot Sync"
          git config user.email "bot@noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Final update bot data"
            git push
          fi
          cd ..
          EXIT_CODE=$(cat bot_exit_code.txt 2>/dev/null || echo "1")
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 0 ]; then
            gh workflow run run.yml --repo ${{ github.repository }}
          fi
